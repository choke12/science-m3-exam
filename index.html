<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบทดสอบปลายภาค พันธุศาสตร์และการแบ่งเซลล์ ม.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#1d2b24;--mut:#5b6b62;--line:#d5e0d9;--pri:#1f6f54;--ok:#1f7a45;--okbg:#e4f5ea;--bad:#b3261e;--badbg:#fdeceb}
@media(prefers-color-scheme:dark){:root{--bg:#121a16;--card:#1a251f;--ink:#e6efe9;--mut:#9db1a5;--line:#2c3c33;--pri:#5fc4a0;--ok:#7bdc9f;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1c1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Sarabun",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header h1{font-size:1.5rem;margin:.2em 0}
header p{margin:0;color:var(--mut)}
.id{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}
.id label{flex:1 1 180px;font-weight:600;font-size:.95rem}
input[type=text],textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
h2{font-size:1.15rem;margin:32px 0 8px;color:var(--pri);border-bottom:2px solid var(--line);padding-bottom:4px}
.q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}
.q p{margin:0 0 8px;font-weight:600}
.q label.o{display:block;padding:5px 10px;margin:3px 0;border-radius:6px;cursor:pointer}
.q label.o:hover{background:var(--bg)}
.q.right{border-color:var(--ok)}.q.wrong{border-color:var(--bad)}
label.o.key{background:var(--okbg);color:var(--ok);font-weight:600}
label.o.miss{background:var(--badbg);color:var(--bad)}
.ans{display:none;margin-top:8px;padding:8px 12px;background:var(--okbg);border-left:4px solid var(--ok);border-radius:4px;font-size:.95rem}
.show .ans{display:block}
textarea{min-height:90px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:2px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--pri)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
#score{display:none;font-size:1.2rem;font-weight:700;padding:12px 16px;border-radius:8px;background:var(--okbg);color:var(--ok)}
@media print{body{background:#fff;color:#000;font-size:13pt}.bar,#score{display:none!important}.q{break-inside:avoid;border-color:#999}.ans{display:none!important}.show .ans{display:none!important}}
</style>
</head>
<body>
<main id="app" class="">
<header>
<h1>แบบทดสอบปลายภาคเรียน โรงเรียนบ้านห้วยจรเข้</h1>
<p>กลุ่มสาระการเรียนรู้วิทยาศาสตร์และเทคโนโลยี ชั้นมัธยมศึกษาปีที่ 3<br>หน่วยการเรียนรู้: พันธุศาสตร์และการแบ่งเซลล์</p>
</header>
<div class="id">
<label>ชื่อ-นามสกุล<input type="text" id="nm"></label>
<label>ชั้น ม.3 /<input type="text" id="cl"></label>
<label>เลขที่<input type="text" id="no"></label>
</div>
<div id="score" role="status"></div>
<h2>ตอนที่ 1: แบบเลือกตอบ (ปรนัย 15 ข้อ รวม 15 คะแนน)</h2>
<div id="mc"></div>
<h2>ตอนที่ 2: แบบอัตนัย (5 ข้อ รวม 5 คะแนน)</h2>
<div id="es"></div>
<div class="bar">
<button id="chk">ส่งข้อสอบ / ตรวจคำตอบ</button>
<button id="prt" class="alt">พิมพ์ / บันทึกเป็น PDF</button>
</div>
</main>
<script>
// แก้ไขข้อสอบและเฉลยได้ที่อาร์เรย์ด้านล่าง (a = ลำดับตัวเลือกที่ถูก เริ่มที่ 0)
const MC=[
{q:"ข้อใดต่อไปนี้ทำหน้าที่กำหนดลักษณะทางพันธุกรรมของสิ่งมีชีวิต",o:["สายดีเอ็นเอ","โปรตีนฮิสโทน","นิวคลีโอโซม","หน่วยพันธุกรรม"],a:3},
{q:"โครโมโซมที่เห็นเป็นเส้นหนาขณะแบ่งเซลล์ เกิดจากการขดตัวของโครงสร้างในข้อใด",o:["ดีเอ็นเอ","โครมาทิน","โครมาทิด","สารพันธุกรรม"],a:1},
{q:"ลักษณะทางพันธุกรรมในข้อใดต่อไปนี้ถูกควบคุมด้วยยีนบนออโตโซม (ก) ผมหยิก (ข) ฮีโมฟีเลีย (ค) หมู่เลือด AB (ง) ตาบอดสี",o:["(ก) และ (ข)","(ค) และ (ง)","(ก) และ (ค)","(ข) และ (ง)"],a:2},
{q:"ถ้านำหนูตะเภาเพศเมียที่มีขนสีดำมาผสมพันธุ์กับหนูตะเภาเพศผู้ซึ่งไม่ทราบสีขน ปรากฏว่าได้ลูกขนสีดำ 1 ตัว แล้วจีโนไทป์ของหนูตะเภาที่เป็นแม่สอดคล้องกับข้อใด (กำหนดให้หนูขนสีดำเป็นลักษณะเด่น หนูขนสีขาวเป็นลักษณะด้อย)",o:["BB","Bb","bb","มีคำตอบมากกว่า 1 ข้อ"],a:3,e:"แม่ขนดำเป็นได้ทั้ง BB และ Bb เพราะลูกที่ได้เพียง 1 ตัวยังบอกจีโนไทป์แม่ไม่ได้แน่ชัด"},
{q:"ถ้าใช้ถั่วเหลืองต้นสูงพันธุ์แท้ ซึ่งเป็นลักษณะเด่น ผสมกับถั่วเหลืองต้นเตี้ยพันธุ์แท้ ซึ่งเป็นลักษณะด้อย รุ่นลูกเป็นต้นสูงทั้งหมด เมื่อนำรุ่นลูกผสมกันจะได้ฟีโนไทป์ของถั่วเหลืองต้นสูงและต้นเตี้ยเป็นสัดส่วนเท่าใด",o:["3 : 1","1 : 3","1 : 1","1 : 2 : 1"],a:0,e:"F1 คือ Tt × Tt → ต้นสูง : ต้นเตี้ย = 3 : 1"},
{q:"ผู้ชายที่ไม่เป็นโรคทาลัสซีเมีย แต่งงานกับผู้หญิงที่ไม่เป็นโรคทาลัสซีเมีย ถ้าลูกชายคนแรกเป็นโรคทาลัสซีเมีย แล้วลูกสาวคนต่อไปจะมีโอกาสเป็นโรคทาลัสซีเมียเท่าไร",o:["1/4","1/2","3/4","ลูกคนต่อไปไม่มีโอกาสเป็นโรคทาลัสซีเมีย"],a:0,e:"พ่อและแม่เป็นพาหะ (Tt × Tt) โอกาสลูกทุกคนเป็นโรค (tt) = 1/4"},
{q:"ลักษณะตาบอดสีควบคุมด้วยยีนด้อยบนโครโมโซม X ถ้าหญิงคนหนึ่งมีพ่อและแม่ตาปกติทั้งคู่ แต่พี่ชายตาบอดสี ข้อใดถูกต้องเกี่ยวกับหญิงคนนี้",o:["มีลักษณะปกติ และไม่มีโอกาสเป็นพาหะของโรคตาบอดสี","มีลักษณะปกติ และมีโอกาสเป็นพาหะของโรคตาบอดสี 25%","มีลักษณะปกติ และมีโอกาสเป็นพาหะของโรคตาบอดสี 50%","มีลักษณะปกติ และมีโอกาสเป็นพาหะของโรคตาบอดสี 100%"],a:2,e:"แม่เป็นพาหะ (XᶜX) พ่อปกติ (XY) ลูกสาวได้ X จากพ่อปกติเสมอ และได้ X จากแม่แบบใดแบบหนึ่ง จึงเป็นพาหะ 50%"},
{q:"ข้อใดสรุปได้ถูกต้องเกี่ยวกับโรคตาบอดสีที่ถูกควบคุมด้วยยีนด้อยบนโครโมโซม X",o:["เพศชายมีโอกาสเป็นพาหะของโรคมากกว่าเพศหญิง","เพศชายมีโอกาสเกิดโรคมากกว่าเพศหญิง เพราะมีโครโมโซม X เพียง 1 แท่ง","เพศหญิงมีโอกาสเกิดโรคมากกว่าเพศชาย เพราะมีโอกาสการเข้าคู่ของยีนด้อยสูง","เพศหญิงไม่สามารถเป็นพาหะของโรคได้ ถ้ามียีนด้อยเพียง 1 ยีน จะแสดงอาการของโรคทันที"],a:1},
{q:"โรคนิ้วเท้าติดกันซึ่งเป็นโรคที่ถ่ายทอดบนโครโมโซม Y มีลักษณะของอาการ คือ นิ้วเท้าจะมีพังผืดยึดติดกัน ถ้าคุณปู่ของมะปรางเป็นโรคนิ้วเท้าติดกัน ข้อใดสรุปถูกต้อง",o:["คุณพ่อและคุณลุงของมะปรางไม่เป็นโรคนิ้วเท้าติดกัน","มะปรางไม่เป็นโรคนิ้วเท้าติดกันแต่เป็นพาหะของโรคนี้","พี่ชายของมะปรางเป็นโรคนิ้วเท้าติดกันโดยถ่ายทอดมาจากคุณพ่อ","ไม่สามารถสรุปได้ เพราะต้องทราบข้อมูลการเป็นโรคนี้ของคุณย่าด้วย"],a:2,e:"ยีนบนโครโมโซม Y ถ่ายทอดจากพ่อสู่ลูกชายทุกคน"},
{q:"เหตุการณ์ในข้อใดเกิดขึ้นในระยะโพรเฟสของการแบ่งเซลล์แบบไมโทซิส",o:["เยื่อหุ้มนิวเคลียสสลายตัว","โครโมโซมจำลองตัวเองในนิวเคลียส","โครโมโซมแต่ละแท่งแยกออกจากกัน","เส้นใยสปินเดิลถูกสร้างขึ้นในไซโทพลาซึม"],a:0,e:"การจำลองโครโมโซมเกิดในอินเตอร์เฟส และโครโมโซมแยกกันในแอนาเฟส"},
{q:"เซลล์ที่มีลักษณะโครโมโซมเข้าคู่กัน (Homologous chromosome) มาเรียงตัวตรงแนวระนาบกึ่งกลางเซลล์ เป็นการแบ่งเซลล์แบบไมโอซิสในระยะใด",o:["เมทาเฟส I","แอนาเฟส I","เมทาเฟส II","แอนาเฟส II"],a:0},
{q:"แมลงหวี่มีจำนวนโครโมโซม 4 คู่ จำนวนโครมาทิดทั้งหมดภายในเซลล์แมลงหวี่ขณะแบ่งนิวเคลียสแบบไมโอซิส (ไมโอซิส I → ไมโอซิส II → สิ้นสุดการแบ่ง) มีจำนวนเท่าใด",o:["16 → 8 → 4","16 → 8 → 8","8 → 8 → 4","8 → 4 → 2"],a:0,e:"ไมโอซิส I: 8 โครโมโซม × 2 โครมาทิด = 16 · ไมโอซิส II: 4 โครโมโซม × 2 = 8 · สิ้นสุด: 4 โครโมโซม แต่ละแท่งมี 1 โครมาทิด = 4"},
{q:"พืชชนิดหนึ่งมีโครโมโซม 2 ชุด จำนวน 14 แท่ง ผสมพันธุ์กับพืชชนิดเดียวกันที่มีโครโมโซม 4 ชุด จำนวน 28 แท่ง ลูก F1 จะเป็นอย่างไร",o:["ลูก F1 ไม่มีชีวิตรอด","ลูก F1 มีชีวิตรอด เป็นหมัน และมีโครโมโซม 3 ชุด จำนวน 21 แท่ง","ลูก F1 มีชีวิตรอด ไม่เป็นหมัน และมีโครโมโซม 3 ชุด จำนวน 21 แท่ง","ลูก F1 มีชีวิตรอด ไม่เป็นหมัน และมีโครโมโซม 6 ชุด จำนวน 42 แท่ง"],a:1,e:"เซลล์สืบพันธุ์ 1 ชุด (7) รวมกับ 2 ชุด (14) = 3 ชุด (21) เป็นชุดคี่จึงจับคู่ในไมโอซิสไม่ได้ ทำให้เป็นหมัน"},
{q:"ผู้ป่วยเป็นเพศชายแต่มีลักษณะโครงสร้างคล้ายเพศหญิง เช่น เต้านมโต และส่วนมากเป็นหมัน เป็นลักษณะเด่นของผู้ที่มีโครโมโซมเพศตามข้อใด",o:["XO","XXX","XYY","XXY"],a:3,e:"กลุ่มอาการไคลน์เฟลเตอร์ (XXY)"},
{q:"ข้อใดไม่ถูกต้องเกี่ยวกับโรคทาลัสซีเมีย",o:["เป็นโรคโลหิตจางชนิดหนึ่ง","ผู้ป่วยควรหลีกเลี่ยงอาหารที่มีธาตุเหล็กสูง","เป็นโรคที่เกิดจากความผิดปกติของยีนที่ควบคุมการสร้างเฮโมโกลบิน","ผู้ที่ได้รับแอลลีลผิดปกติจากพ่อหรือแม่เพียงฝ่ายเดียวมีโอกาสเป็นโรคได้"],a:3,e:"ทาลัสซีเมียเป็นลักษณะด้อย ผู้ที่ได้รับแอลลีลผิดปกติจากพ่อหรือแม่ฝ่ายเดียวจะเป็นพาหะ ไม่แสดงอาการของโรค"}
];
const ES=[
{q:"เพราะเหตุใดเมนเดลจึงเลือกทำการทดลองด้านพันธุศาสตร์โดยใช้ต้นถั่วลันเตา",e:"ถั่วลันเตาปลูกง่าย วงชีวิตสั้น ให้ลูกหลานจำนวนมาก มีลักษณะแตกต่างที่เห็นชัดเจนและเป็นคู่ตรงข้ามกัน (เช่น ต้นสูง/ต้นเตี้ย) ผสมพันธุ์ควบคุมได้ทั้งแบบผสมตัวเองและผสมข้ามต้น"},
{q:"โรคคนแคระเกิดจากการถ่ายทอดยีนเด่นจากพ่อแม่สู่ลูก ถ้าครอบครัวหนึ่งพ่อและแม่เป็นโรคคนแคระ ลูกคนแรกไม่เป็นโรคนี้ แล้วลูกคนต่อไปจะมีโอกาสเป็นโรคนี้กี่เปอร์เซ็นต์",e:"ลูกปกติเป็น dd แสดงว่าพ่อและแม่เป็น Dd × Dd ลูกคนต่อไปเป็นโรค (DD หรือ Dd) = 3/4 หรือ 75%"},
{q:"การแบ่งไซโทพลาซึมของเซลล์สัตว์และเซลล์พืชต่างกันอย่างไร",e:"เซลล์สัตว์ เยื่อหุ้มเซลล์คอดเข้าเป็นร่องจากด้านนอกเข้าสู่ด้านในจนขาดเป็น 2 เซลล์ · เซลล์พืช มีเซลล์เพลต (cell plate) สร้างขึ้นกลางเซลล์แล้วขยายออกไปทางด้านข้างจนกลายเป็นผนังเซลล์กั้น"},
{q:"เพราะเหตุใดจึงไม่นิยมให้มีการแต่งงานในหมู่เครือญาติเดียวกัน อธิบายโดยใช้หลักพันธุศาสตร์",e:"เครือญาติมีโอกาสมียีนด้อยที่ผิดปกติซึ่งได้รับมาจากบรรพบุรุษร่วมกัน เมื่อแต่งงานกัน ลูกมีโอกาสได้รับยีนด้อยคู่เดียวกัน (โฮโมไซกัสด้อย) มากขึ้น จึงเสี่ยงต่อการเป็นโรคทางพันธุกรรมสูงขึ้น"},
{q:"สิ่งมีชีวิตดัดแปรพันธุกรรมอาจก่อให้เกิดประโยชน์และโทษอย่างไรต่อความหลากหลายทางชีวภาพ",e:"ประโยชน์: ได้พืชสัตว์ที่ทนโรค ทนแมลงศัตรูพืช ผลผลิตสูง ลดการใช้สารเคมี · โทษ: อาจถ่ายทอดยีนสู่พันธุ์ดั้งเดิมในธรรมชาติ ทำให้พันธุ์ท้องถิ่นลดลง สายพันธุ์เดียวครอบงำระบบนิเวศ และความหลากหลายของพันธุกรรมลดลง"}
];
const $=id=>document.getElementById(id),L=["ก","ข","ค","ง"];
$("mc").innerHTML=MC.map((m,i)=>`<div class="q" id="m${i}"><p>${i+1}. ${m.q}</p>`+m.o.map((t,j)=>`<label class="o"><input type="radio" name="q${i}" value="${j}"> ${L[j]}. ${t}</label>`).join("")+`<div class="ans"><b>เฉลย: ${L[m.a]}</b>${m.e?" — "+m.e:""}</div></div>`).join("");
$("es").innerHTML=ES.map((m,i)=>`<div class="q"><p>${i+1}. ${m.q} (1 คะแนน)</p><textarea aria-label="คำตอบข้อ ${i+1}"></textarea><div class="ans"><b>แนวคำตอบ:</b> ${m.e}</div></div>`).join("");
$("chk").onclick=()=>{
 let s=0;
 MC.forEach((m,i)=>{
  const box=$("m"+i),v=box.querySelector("input:checked"),ok=v&&+v.value===m.a;
  if(ok)s++;
  box.classList.remove("right","wrong");box.classList.add(ok?"right":"wrong");
  box.querySelectorAll("label.o").forEach((l,j)=>{l.classList.toggle("key",j===m.a);l.classList.toggle("miss",!!v&&+v.value===j&&!ok)});
 });
 $("app").classList.add("show");
 const b=$("score");b.style.display="block";
 b.textContent=`ตอนที่ 1 ได้ ${s} / ${MC.length} คะแนน (ตอนที่ 2 เทียบกับแนวคำตอบและตรวจโดยครู)`;
 b.scrollIntoView({behavior:"smooth"});
};
$("prt").onclick=()=>window.print();
</script>
</body>
</html>
